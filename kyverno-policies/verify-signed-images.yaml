apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-signed-images
spec:
  attestors:
  - cosign:
      key:
        data: '-----BEGIN PUBLIC KEY-----

          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAECO90iMiA3v/06ijEJunzt9rdmIsV

          Kkgh03V+03du7pTseNDo1aZN1jqfMAIp82w9+AaRFwFWS108MQfvHkW/hw==

          -----END PUBLIC KEY-----

          '
    name: cosign
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchImageReferences:
  - glob: docker.io/anilarelli/my-app*
  validationActions:
  - Deny
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  validations:
  - expression: "images.containers.map(\n  image,\n  verifyImageSignatures(image,\
      \ [attestors.cosign])\n).all(result, result > 0)\n"
    message: Container images must have a valid Cosign signature from the trusted
      key.
  webhookConfiguration:
    timeoutSeconds: 15
