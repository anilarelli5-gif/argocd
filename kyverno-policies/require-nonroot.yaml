apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-nonroot
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Deny
  validations:
  - expression: "(object.spec.containers + object.spec.?initContainers.orValue([])\
      \ + object.spec.?ephemeralContainers.orValue([])).all(\n  container,\n  container.?securityContext.?runAsNonRoot.orValue(\n\
      \    object.spec.?securityContext.?runAsNonRoot.orValue(false)\n  ) == true\n\
      )\n"
    message: Containers must run as non-root.
