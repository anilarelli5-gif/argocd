apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-registries
spec:
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - gatekeeper-system
        - dev
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Deny
  validations:
  - expression: "(object.spec.containers + object.spec.?initContainers.orValue([])\
      \ + object.spec.?ephemeralContainers.orValue([])).all(\n  container,\n  container.image.startsWith('docker.io/')\
      \ ||\n  container.image.startsWith('registry.k8s.io/')\n)\n"
    message: Images must come from docker.io or registry.k8s.io.
