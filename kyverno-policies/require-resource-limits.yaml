apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
spec:
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - gatekeeper-system
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Deny
  validations:
  - expression: "object.spec.containers.all(\n  container,\n  has(container.resources)\
      \ &&\n  has(container.resources.limits) &&\n  has(container.resources.limits.cpu)\
      \ &&\n  has(container.resources.limits.memory)\n)\n"
    message: Every container must define CPU and memory limits.
