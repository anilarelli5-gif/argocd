apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Deny
  validations:
  - expression: "(object.spec.containers + object.spec.?initContainers.orValue([])).all(\n\
      \  container,\n  container.?securityContext.?privileged.orValue(false) == false\n\
      )\n"
    message: Privileged containers are not allowed.
