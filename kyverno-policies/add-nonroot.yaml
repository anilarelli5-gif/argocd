apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-nonroot
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  mutations:
  - applyConfiguration:
      expression: "Object{\n  spec: Object.spec{\n    securityContext: Object.spec.securityContext{\n\
        \      runAsNonRoot: true,\n      runAsUser: 101\n    }\n  }\n}\n"
    patchType: ApplyConfiguration
